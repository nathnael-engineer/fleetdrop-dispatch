name: fleetdrop_dispatch
description: "Real-time vehicle routing and geospatial dispatch with binary protobuf delta streaming."
publish_to: "none"
version: 3.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  mapbox_maps_flutter: ^1.2.0
  geolocator: ^12.0.0
  web_socket_channel: ^3.0.1
  protobuf: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true